name: Update pricing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-pricing.yml"
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: pricing-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and normalize pricing
        run: python scraper/main.py

      - name: Commit pricing data
        run: |
          git config user.name "coding-plans-bot"
          git config user.email "coding-plans-bot@users.noreply.github.com"
          git add data/current.json data/history/
          if git diff --cached --quiet; then
            echo "No pricing data changes to commit"
            exit 0
          fi
          git commit -m "chore: update pricing data"
          git push
