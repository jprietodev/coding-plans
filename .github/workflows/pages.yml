name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "compare.js"
      - "insights.js"
      - "bootstrap.js"
      - "style.css"
      - "compare.css"
      - "insights.css"
      - "data/current.json"
      - "data/history/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Update pricing"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate frontend JavaScript
        run: |
          node --check app.js
          node --check compare.js
          node --check insights.js
          node --check bootstrap.js

      - name: Prepare static site
        run: |
          mkdir -p _site/data/history
          cp index.html app.js compare.js insights.js bootstrap.js style.css compare.css insights.css _site/
          cp data/current.json _site/data/current.json
          cp data/history/*.json _site/data/history/ 2>/dev/null || true
          python - <<'PY'
          import json
          from pathlib import Path

          history = Path('_site/data/history')
          names = sorted(path.name for path in history.glob('*.json') if path.name != 'index.json')
          (history / 'index.json').write_text(json.dumps(names, indent=2) + '\n', encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
